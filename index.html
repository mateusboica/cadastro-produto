<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos - Camarão</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input,
        textarea,
        button {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <h2>Novo Produto</h2>
    <form id="produtoForm">
        <input type="text" id="nome" placeholder="Nome do Produto" required>
        <input type="number" id="preco" placeholder="Preço (ex: 89.90)" step="0.01" required>
        <textarea id="descricao" placeholder="Descrição"></textarea>
        <input type="file" id="imagem" accept="image/*">
        <input type="text" id="categoria" placeholder="Categoria">
        <button type="submit">Adicionar Produto</button>
    </form>

    <script>
        document.getElementById('produtoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const produto = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                descricao: document.getElementById('descricao').value,
                imagem: document.getElementById('imagem').files[0] ? URL.createObjectURL(document.getElementById('imagem').files[0]) : null,
                categoria: document.getElementById('categoria').value,
                slug: document.getElementById('nome').value.toLowerCase().replace(/ /g, '-'),
                disponivel: true
            };

            try {
                const response = await fetch('https://back-camarao.onrender.com/api/v1/produtos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(produto)
                });

                if (response.ok) {
                    alert('Produto salvo com sucesso! Verifique o MongoDB Atlas.');
                    e.target.reset();
                } else {
                    const erro = await response.json();
                    alert('Erro do Servidor: ' + (erro.detail || 'Verifique o console'));
                }
            } catch (error) {
                alert('Erro de conexão: Verifique se o CORS está liberado no Spring!');
                console.error(error);
            }
        });
    </script>
</body>

</html>
